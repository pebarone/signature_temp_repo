# MODELO. Não aplicar com os placeholders e nunca commitar valores reais.
# O Secret real é criado no cluster com `oc create secret generic` (ver README, passo 2.2), fora do repositório.
# Este arquivo NÃO está em nenhum kustomization.yaml. `oc apply -f deploy/openshift/` o aplicaria e sobrescreveria
# o Secret real com os placeholders: use `oc apply -k deploy/openshift/prod`.
apiVersion: v1
kind: Secret
metadata:
  name: signature-orchestrator-env
  labels:
    app: signature-orchestrator
type: Opaque
stringData:
  # Client ID da aplicação Adobe Sign (produção)
  CLIENT_ID: "<llenar>"
  # Client secret da aplicação Adobe Sign (produção)
  CLIENT_SECRET: "<llenar>"
  # Segredo HMAC compartilhado com o WebReport (valida a assinatura da chamada /start)
  SIGNATURE_SECRET: "<llenar>"
  # Usuário do Basic Auth (/admin/*, /logs)
  LOG_USER: "<llenar>"
  # Senha do Basic Auth (/admin/*, /logs)
  LOG_PASS: "<llenar>"
  # Opcional: Basic Auth próprio do POST /auth (a credencial embutida no WebReport). llenar as DUAS ou nenhuma:
  # sem elas vale LOG_USER/LOG_PASS. Deixe preenchidas com valores diferentes de LOG_*: a do WebReport fica visível no HTML.
  START_AUTH_USER: "<llenar>"
  START_AUTH_PASS: "<llenar>"
  # Usuário do OTCS (OTDS) usado pela integração
  OTCS_USER: "<llenar>"
  # Senha do OTCS (OTDS) usada pela integração
  OTCS_PASS: "<llenar>"
  # Opcional: refresh token do Adobe. Deixar VAZIO (não placeholder: um valor não vazio seria usado como token)
  # e autorizar em /admin/login, que grava tokens.json no volume.
  ADOBE_REFRESH_TOKEN: ""
