# Recursos comuns a QA e PROD. Não se aplica sozinho: use um ambiente, `oc apply -k deploy/openshift/prod` ou
# `oc apply -k deploy/openshift/qa`. O Secret NÃO entra aqui: é criado separadamente (ver README, passo 2.2).
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - pvc.yaml
  - configmap.yaml
  - deployment.yaml
  - service.yaml
  - route.yaml
