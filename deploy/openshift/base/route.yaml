# Route pública do orquestrador (roteador do OpenShift). O host e o TLS mudam por ambiente: ../prod/route-env.yaml e
# ../qa/kustomization.yaml. O host deve ser o mesmo de PUBLIC_URL.
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: signature-orchestrator
  labels:
    app: signature-orchestrator
  annotations:
    # Timeout do roteador: maior que OTCS_TIMEOUT_MS e ADOBE_TIMEOUT_MS (60s por padrão)
    haproxy.router.openshift.io/timeout: 120s
spec:
  to:
    kind: Service
    name: signature-orchestrator
    weight: 100
  port:
    targetPort: http
