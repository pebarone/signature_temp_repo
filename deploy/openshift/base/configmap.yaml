# Configuração NÃO sensível do orquestrador, comum a QA e PROD. Segredos ficam no Secret signature-orchestrator-env
# (ver ../secret.example.yaml). O que muda por ambiente (PUBLIC_URL, OTCS_BASE, Adobe e CORS_ORIGINS) fica em
# ../prod/configmap-env.yaml e ../qa/configmap-env.yaml. Defaults: server/config/index.js.
apiVersion: v1
kind: ConfigMap
metadata:
  name: signature-orchestrator-config
  labels:
    app: signature-orchestrator
data:
  # Timeout (ms) de cada chamada ao Adobe, inclusive refresh e troca de token
  ADOBE_TIMEOUT_MS: "60000"
  # Tentativas de baixar o PDF assinado (o Adobe responde 403 por alguns segundos logo depois da assinatura)
  ADOBE_DOWNLOAD_ATTEMPTS: "8"
  # Atraso inicial (ms) e teto (ms) entre essas tentativas
  ADOBE_DOWNLOAD_RETRY_DELAY_MS: "3000"
  ADOBE_DOWNLOAD_RETRY_MAX_DELAY_MS: "30000"
  # Timeout (ms) de cada chamada ao OTCS
  OTCS_TIMEOUT_MS: "60000"
  # Liga o polling de acordos sem resultado final
  POLL_ENABLED: "true"
  # Intervalo do polling (ms)
  POLL_INTERVAL_MS: "600000"
  # Atraso (ms) antes do primeiro ciclo de polling após o start
  POLL_INITIAL_DELAY_MS: "30000"
  # Máximo de acordos consultados por ciclo de polling
  POLL_MAX_PER_TICK: "50"
  # Idade máxima (dias) de um acordo que ainda é consultado pelo polling
  POLL_MAX_AGE_DAYS: "90"
  # Base (ms) do backoff exponencial dos retries
  RETRY_BASE_MS: "60000"
  # Teto (ms) do backoff exponencial dos retries
  RETRY_MAX_MS: "3600000"
  # Tentativas antes de needs_attention (0 = sem limite)
  RETRY_MAX_ATTEMPTS: "10"
  # Dias de retenção dos logs diários (0 desativa a purga)
  LOG_RETENTION_DAYS: "15"
  # Nome da disposição (custom_action) de assinatura concluída no workflow
  DISPOSITION_SIGNED: "Firmado"
  # Nome da disposição (custom_action) de recusa no workflow
  DISPOSITION_REJECTED: "Rechazado"
  # Disposição de expiração (os mapas só têm Firmado/Rechazado); vazio => needs_attention
  DISPOSITION_EXPIRED: "Rechazado"
  # Acordo expirado: SendOn da firma com o comentário de caducidad; no fluxo puro (firma = workflow) depois para o fluxo no Content (exige permissão de stop do usuário de integração); no subfluxo só a firma é cancelada
  EXPIRED_STOP_WORKFLOW: "true"
  # Disposição de recall; vazio => needs_attention
  DISPOSITION_RECALLED: "Rechazado"
  # Disposição de falha de conversão; vazio => needs_attention
  DISPOSITION_CONVERSION_FAILED: "Rechazado"
  # OBSOLETO: a tarefa da disposição é localizada pelo nome (SIGN_TASK_NAMES); mantido só por compatibilidade
  SIGN_TASK_ID: "3"
  # Tarefa que recebe a disposição final, localizada pelo NOME (lista; o nome normalizado COMEÇA com um destes)
  SIGN_TASK_NAMES: "Aguardar Firma"
  # Tarefa de início (SendOn depois de criar o acordo; /start exige que esteja ativa), localizada pelo nome
  START_TASK_NAMES: "Enviar solicitud de firma"
  # Horas até reabrir sozinho um needs_attention por "reintentos agotados" (0 = nunca)
  ATTENTION_RETRY_HOURS: "6"
  # Webhook de acordo desconhecido (banco perdido/deploy novo): adota se o externalId for nosso
  ADOPT_UNKNOWN_AGREEMENTS: "true"
  # ClientIds extras aceitos no X-AdobeSign-ClientId do webhook, além do CLIENT_ID (lista; ex.: o do app que criou o webhook na UI)
  WEBHOOK_CLIENT_IDS: ""
  # Atributos do workflow com dados do Adobe (best effort; formUpdate ainda não validado em QA => desligado)
  WF_ATTRIBUTES_ENABLED: "false"
  # Rótulos dos atributos no mapa do workflow; vazio desliga aquele atributo
  WF_ATTR_AGREEMENT_ID: "Adobe ID Acuerdo"
  WF_ATTR_STATUS: "Adobe Estado"
  WF_ATTR_LAST_EVENT: "Adobe Último Evento"
  WF_ATTR_UPDATED_AT: "Adobe Fecha Actualización"
  WF_ATTR_INTEGRATION_STATE: "Estado Integración Firma"
  # POST /start: confere o pedido contra o workflow no OTCS (fonte da verdade: DocID, AttachID, e-mails)
  START_VERIFY_WORKFLOW: "true"
  # Rótulos dos atributos do formulário da tarefa de início
  START_FIELD_DOCID: "DocID"
  START_FIELD_ATTACHID: "AttachID"
  START_FIELD_DOCNAME: "Nombre del Documento"
  START_FIELD_EMAILS: "Email Firmante 1,Email Firmante 2"
  # Atributo oculto com o prazo da assinatura (dias, 1 a 365), enviado ao Adobe como expirationTime; vazio desliga
  START_FIELD_DUE_DATE: "DUE_DATE"
  # Transição dos WebReports (ordem de rollout em webreports/README.md): DESLIGADAS, passo 4 concluído (os WebReports de PROD
  # já falam o protocolo v2). Com "false", GET /auth, a assinatura v1 e o GET /start antigo respondem 404/403. Só religue
  # ("true") como rollback, se um WebReport antigo voltar a ser publicado; depois rode
  # `oc apply -k deploy/openshift/prod && oc rollout restart deploy/signature-orchestrator`.
  START_LEGACY_SIGNATURE: "false"
  START_LEGACY_GET_ENABLED: "false"
  # false: aceita POST /webhook sem ClientId conhecido; true: exige CLIENT_ID ou um dos WEBHOOK_CLIENT_IDS
  WEBHOOK_REQUIRE_CLIENT_ID: "false"
