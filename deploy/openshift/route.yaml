# Route HTTPS pública do orquestrador (roteador do OpenShift).
# O host deve ser o mesmo de PUBLIC_URL (configmap.yaml). É o host do orquestrador atual de PROD: enquanto a Route antiga
# existir, esta fica sem admissão (HostAlreadyClaimed). Ver README, seção 2.7 (troca do orquestrador antigo).
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: signature-orchestrator
  labels:
    app: signature-orchestrator
  annotations:
    # Timeout do roteador: maior que OTCS_TIMEOUT_MS e ADOBE_TIMEOUT_MS (60s por padrão)
    haproxy.router.openshift.io/timeout: 120s
spec:
  host: co-saphcm-ms-md-co-sign-empcontract-prod.apps.osftd4.colsanitas.com
  to:
    kind: Service
    name: signature-orchestrator
    weight: 100
  port:
    targetPort: http
  tls:
    termination: edge
    # HTTP é redirecionado para HTTPS
    insecureEdgeTerminationPolicy: Redirect
