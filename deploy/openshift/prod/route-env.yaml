# TLS da Route de PROD (a Route base está em ../base/route.yaml). O host NÃO fica aqui: vem de PUBLIC_URL, em params.env.
# Enquanto a Route antiga tiver o mesmo host, esta não é admitida (HostAlreadyClaimed). Ver README, seção 2.7.
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: signature-orchestrator
spec:
  tls:
    termination: edge
    # HTTP é redirecionado para HTTPS
    insecureEdgeTerminationPolicy: Redirect
